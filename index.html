<!DOCTYPE html>
<html lang="en" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="">
<title>Audiobook Player</title>
<script>try{var c=JSON.parse(localStorage.getItem('ab_cfg')||'{}'),th=c.theme||'auto';document.documentElement.dataset.theme=th==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):th}catch(e){}</script>
<style>
/* ================= design tokens ================= */
:root,[data-theme=dark]{color-scheme:dark;
 --bg:#0f0d0a;--bgT:#0f0d0ad9;--s:#1a1611;--s2:#292219;--s3:#352b1e;--hair:#ffffff12;
 --t:#f5eee2;--m:#a2957f;--a:#f5b45c;--a2:#ffcf8f;--ink:#241500;
 --sh:#000a;--glow:#f5b45c2e;--covG0:#c2762b;--covG1:#3a1d12;--danger:#ff7a6e}
[data-theme=light]{color-scheme:light;
 --bg:#f7f3ec;--bgT:#f7f3ecd9;--s:#fffdf8;--s2:#efe7d9;--s3:#e5dbc9;--hair:#0000000f;
 --t:#211a12;--m:#7c7060;--a:#b4611d;--a2:#b4611d;--ink:#fff;
 --sh:#3a2a1522;--glow:#b4611d1f;--covG0:#d99a52;--covG1:#7a4316;--danger:#c43d33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.tr *{transition:background-color .35s,color .35s,border-color .35s}
@media(prefers-reduced-motion:reduce){html.tr *,#pn,#bd,.accB,main section{transition:none!important;animation:none!important}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:16px/1.4 "Noto Naskh Arabic","Geeza Pro",Georgia,"Iowan Old Style",serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:auto;padding:2px 16px 40px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main section{animation:vIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
h1{font-size:30px;margin:0;letter-spacing:-.3px;font-weight:800}
h3{font:700 12px system-ui,"Noto Sans Arabic",sans-serif;color:var(--m);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.08em}
/* ================= buttons ================= */
button{font:600 15px system-ui,"Noto Sans Arabic",sans-serif;color:var(--t);background:var(--s2);border:1px solid var(--hair);border-radius:16px;min-height:48px;min-width:48px;padding:0 16px;transition:transform .12s,filter .15s,background .2s}
button:active{transform:scale(.95);filter:brightness(1.2)}
button.on{background:var(--a);color:var(--ink);border-color:transparent}
.iconB{display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
/* ================= sticky headers ================= */
.bar{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 2px 12px;background:var(--bgT);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar>div{display:flex;gap:8px}
.bar button{border-radius:999px;min-height:42px;font-size:14px}
/* ================= crumbs / search / scan ================= */
#crumbs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;white-space:nowrap;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
#crumbs button{flex:none;min-height:36px;border-radius:999px;font-size:13px;padding:0 14px;background:var(--s)}
#crumbs button.on{background:var(--s3);color:var(--a2)}
#searchW{display:flex;gap:8px;align-items:center;background:var(--s);border:1px solid var(--hair);border-radius:999px;padding:0 16px;margin:6px 0 10px;min-height:46px}
#searchW span{color:var(--m);font-size:16px}
#search{flex:1;min-width:0;border:0;background:none;color:var(--t);font:inherit;min-height:44px;outline:none}
#sX{min-width:32px;min-height:32px;border-radius:999px;color:var(--m);background:transparent;border:0;padding:0}
#scan{display:flex;align-items:center;gap:10px;background:var(--s);border:1px dashed var(--hair);border-radius:16px;padding:10px 14px;margin:8px 0;font:13px system-ui,"Noto Sans Arabic",sans-serif;color:var(--m)}
#scan .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--s3);border-top-color:var(--a);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* ================= lists & rows ================= */
.row{display:flex;align-items:center;gap:12px;background:var(--s);border:1px solid var(--hair);border-radius:18px;padding:10px 12px;margin:8px 0;min-height:72px;transition:transform .12s,background .2s}
.row:active{transform:scale(.985);background:var(--s2)}
.cvBox{position:relative;flex:none;width:52px;height:52px}
.cvp,.cv{position:absolute;inset:0;width:52px;height:52px;border-radius:12px}
.cvp{display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(140deg,var(--covG0),var(--covG1));color:#fff}
.cv{object-fit:cover;display:none}
.cv.on{display:block}
.row .ic{font-size:24px;width:40px;text-align:center;flex:none}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--m);font:12.5px system-ui,"Noto Sans Arabic",sans-serif;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tx i{display:block;height:4px;background:var(--s2);border-radius:999px;margin-top:7px;overflow:hidden}
.tx u{display:block;height:4px;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:999px}
.empty{color:var(--m);text-align:center;padding:44px 12px;white-space:pre-line;font-size:15px}
/* ================= hero "continue listening" ================= */
#hero{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--s2),var(--s));border:1px solid var(--hair);border-radius:22px;padding:14px;margin:6px 0 12px}
#hero .cvBox{width:64px;height:64px}#hero .cvp,#hero .cv{width:64px;height:64px;border-radius:16px;font-size:30px}
#hero b{font-size:16px;display:block}
#hero .tx small{font-size:12px}
#hero .playR{flex:none;width:52px;height:52px;border-radius:50%;background:var(--a);color:var(--ink);font-size:20px;padding:0}
/* ================= playlists section ================= */
.plTabs{display:flex;gap:8px;padding:2px 0 12px;overflow-x:auto;scrollbar-width:none;position:sticky;top:66px;z-index:5;background:var(--bgT);backdrop-filter:blur(16px)}
.plTabs::-webkit-scrollbar{display:none}
.plTabs button{flex:none;border-radius:999px;min-height:40px;font-size:13.5px;padding:0 16px;background:var(--s)}
.plTabs button.on{background:var(--a);color:var(--ink)}
/* ================= sort bar ================= */
.sort{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.sort span{color:var(--m);font-size:15px}
.sort select{flex:1.2;min-height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--s);color:var(--t);padding:0 12px;font:600 14px system-ui,"Noto Sans Arabic",sans-serif;appearance:none}
.sort button{flex:1;min-height:46px;font-size:13px}
/* ================= full-screen player ================= */
#v-play{position:relative;padding-top:6px}
.pglow{position:absolute;inset:-40px -60px auto -60px;height:340px;background:radial-gradient(ellipse 70% 100% at 50% 0%,var(--glow),transparent 70%);pointer-events:none}
#coverW{position:relative;width:min(72vw,320px);margin:18px auto 6px}
#cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 24px 48px -12px var(--sh),0 0 0 1px var(--hair);background:var(--s2)}
.tapB{position:absolute;top:50%;transform:translateY(-50%) scale(.7);background:#000000b8;color:#fff;font:700 14px system-ui,sans-serif;padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;direction:ltr;z-index:2}
.tapB.on{opacity:1;transform:translateY(-50%) scale(1)}
#tapL{left:6%}#tapR{right:6%}
#ttl{font-size:23px;font-weight:800;text-align:center;margin:16px 24px 2px;letter-spacing:-.2px}
#sub{text-align:center;color:var(--m);font:14px system-ui,"Noto Sans Arabic",sans-serif;min-height:20px}
#chName{text-align:center;color:var(--a2);font:13px system-ui,"Noto Sans Arabic",sans-serif;min-height:18px;margin-top:2px}
input[type=range]{width:100%;height:32px;accent-color:var(--a);background:none}
.tm{display:flex;justify-content:space-between;color:var(--m);font:12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;margin-top:-4px}
#seek{direction:ltr}
.tr{display:flex;gap:4px;justify-content:center;align-items:center;margin:8px 0 4px;direction:ltr}
.tr button{background:transparent;border:0;border-radius:50%;min-width:60px;min-height:60px;font-size:22px;color:var(--t)}
.tr button:active{background:var(--s2)}
#bBack,#bFwd{font:700 13px system-ui,sans-serif;color:var(--m)}
#bPlay{width:88px;height:88px;min-width:88px;border-radius:50%;background:var(--a);color:var(--ink);font-size:34px;box-shadow:0 10px 28px var(--glow),0 4px 12px var(--sh)}
#bPlay:active{transform:scale(.93)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tools button{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;min-height:82px;padding:6px 2px;border-radius:20px;background:var(--s)}
.tools span{font-size:23px}.tools b{font-size:12px}.tools small{color:var(--m);font-size:11.5px}
#gHint{text-align:center;color:var(--m);font:12px system-ui,"Noto Sans Arabic",sans-serif;margin:14px 8px 0;opacity:.75}
/* ================= mini player ================= */
#mini{position:relative;display:flex;align-items:center;gap:8px;margin:0 10px 8px;padding:8px 8px;border-radius:18px;background:var(--s2);border:1px solid var(--hair);box-shadow:0 10px 30px var(--sh);backdrop-filter:blur(12px);overflow:hidden}
#mini .cvBox{width:44px;height:44px;flex:none;cursor:pointer}
#mini .cvp,#mini .cv{width:44px;height:44px;border-radius:11px;font-size:20px}
#mTx{flex:1;min-width:0;cursor:pointer}
#mTx b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mTx small{display:block;color:var(--m);font:11.5px system-ui,"Noto Sans Arabic",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini button{min-width:40px;min-height:40px;border-radius:50%;padding:0;background:transparent;border:0;font-size:16px}
#mini #mSkipB,#mini #mSkipF{font:700 11.5px system-ui,sans-serif;color:var(--m)}
#mini #mPlay{width:44px;height:44px;background:var(--a);color:var(--ink);font-size:18px;flex:none}
#mBar{position:absolute;inset-inline:0;top:0;height:2.5px;background:#ffffff10}
#mBar u{display:block;height:100%;background:var(--a);width:0}
@media(max-width:390px){#mini #mPrev{display:none!important}}
/* ================= bottom nav ================= */
#tabs{display:flex;gap:2px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--bgT);backdrop-filter:blur(16px);border-top:1px solid var(--hair)}
#tabs button{flex:1;background:none;border:0;color:var(--m);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 2px;border-radius:16px}
#tabs span{font-size:21px;transition:transform .15s}
#tabs small{font-size:10.5px;font-weight:600}
#tabs button.on{background:var(--s2);color:var(--a2)}
#tabs button.on span{transform:translateY(-1px) scale(1.08)}
/* ================= settings accordion ================= */
.accCard{background:var(--s);border:1px solid var(--hair);border-radius:20px;margin:10px 0;overflow:hidden}
.accH{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:0;padding:16px;text-align:start}
.accH .aIc{font-size:22px;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:12px}
.accH .aTx{flex:1;min-width:0}
.accH .aTx b{display:block;font-size:15.5px}
.accH .aTx small{display:block;color:var(--m);font-size:12px;font-weight:400;margin-top:1px}
.accH .chv{color:var(--m);transition:transform .25s;font-size:14px}
.accCard.open .chv{transform:rotate(90deg)}
.accB{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.9,.3,1)}
.accB>div{overflow:hidden}
.accCard.open .accB{grid-template-rows:1fr}
.accIn{padding:2px 16px 16px;border-top:1px solid var(--hair);padding-top:12px;margin:0 16px 16px;padding-bottom:2px}
.accIn .row{background:var(--s2);margin:8px 0}
/* ================= misc components ================= */
.chips,.seg,.add{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips button,.seg button{flex:1;min-height:44px;font-size:14px}
.add button{flex:none}
.big{font:800 42px Georgia,serif;text-align:center;margin:8px 0;direction:ltr;letter-spacing:-1px}
label.ctl{display:flex;gap:10px;align-items:center;margin:12px 2px 4px;font:15px system-ui,"Noto Sans Arabic",sans-serif;color:var(--t)}
label.ctl input{width:22px;height:22px;accent-color:var(--a)}
label.ctl small{display:block;color:var(--m);font-size:12px;font-weight:400}
.info{color:var(--m);font:13px system-ui,"Noto Sans Arabic",sans-serif;margin:8px 2px}
.stack{display:flex;flex-direction:column;gap:8px}
#chL button{text-align:start;font-weight:400;min-height:46px}
/* ================= bottom sheet ================= */
#sheet{position:fixed;inset:0;z-index:20}
#bd{position:absolute;inset:0;background:#0009;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px)}
#pn{position:absolute;inset-inline:0;bottom:0;background:var(--s);border:1px solid var(--hair);border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));max-height:82dvh;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
#sheet.open #bd{opacity:1}#sheet.open #pn{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0;font-size:21px;font-weight:800}
#toast{position:fixed;inset-inline:0;margin:auto;width:max-content;bottom:150px;background:var(--t);color:var(--bg);padding:11px 20px;border-radius:999px;font:600 13px system-ui,"Noto Sans Arabic",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);max-width:90vw;text-align:center;z-index:30;box-shadow:0 8px 24px var(--sh)}
#toast.on{opacity:1;transform:none}
input[type=text]{flex:1;min-width:0;min-height:48px;border-radius:14px;border:1px solid var(--hair);background:var(--s2);color:var(--t);padding:0 14px;font:inherit;outline:none}
</style></head>
<body>
<main>
 <section id="v-lib">
  <div class="bar"><h1 data-i="lib"></h1><div><button id="addDir">📂 <span data-i="addFolder"></span></button><button id="addFiles">🎵 <span data-i="addFiles"></span></button></div></div>
  <div id="hero" hidden><div class="cvBox"><div class="cvp">🎧</div><img class="cv" id="hCv" alt=""></div><div class="tx"><b id="hTtl"></b><small id="hSub"></small><i><u id="hBar"></u></i></div><button class="playR" id="hPlay">▶</button></div>

 </section>

  <div id="coverW"><img id="cover" alt=""><div id="tapL" class="tapB">−10</div><div id="tapR" class="tapB">+30</div></div>

  <div class="tools">
   <button id="bSpeed"><span>⏩</span><b data-i="speed"></b><small></small></button>
   <button id="bSleep"><span>🌙</span><b data-i="sleep"></b><small></small></button>

</main>
<div id="mini" hidden>
 <i id="mBar"><u id="mBarU"></u></i>

 <div id="mTx"><b id="mTtl"></b><small id="mSub"></small></div>

/* ================================================================
   Directory-tree index — every view reads only its own folder slice.
   ================================================================ */
let dirIdx=null,idxVer=-1;
function buildIdx(){
 dirIdx=new Map();idxVer=libVer;
 for(const k in lib.files){
  const d=dirOf(k);let node=dirIdx.get(d);if(!node){node={files:[],dirs:new Map()};dirIdx.set(d,node)}node.files.push(k);
 }
 for(const d of dirIdx.keys()){
  const p=d.slice(0,-1),i=p.lastIndexOf('/'),parent=i<0?'/':p.slice(0,i+1),name=i<0?p:p.slice(i+1);
  let pn=dirIdx.get(parent);if(!pn){pn={files:[],dirs:new Map()};dirIdx.set(parent,pn)}
  if(!pn.dirs.has(name))pn.dirs.set(name,d);
 }
}
function idxGet(prefix){if(idxVer!==libVer)buildIdx();return dirIdx.get(prefix)||{files:[],dirs:new Map()}}
const gatherCache=new Map();
function gather(prefix){
 if(idxVer!==libVer)buildIdx();
 const hit=gatherCache.get(prefix);if(hit&&hit.v===idxVer)return hit.a;
 const out=[];(function rec(p){const n=dirIdx.get(p);if(!n)return;out.push(...n.files);for(const cp of n.dirs.values())rec(cp)})(prefix);
 gatherCache.set(prefix,{v:idxVer,a:out});
 if(gatherCache.size>60&&Math.random()<.2)for(const[k2,v]of gatherCache)if(v.v!==idxVer)gatherCache.delete(k2);
 return out;
}

/* ---------- memoized metrics ---------- */
const metrCache=new Map();
function metr(keys,fallbackName){
 const ver=libVer+':'+progVer+':'+recVer,name=fallbackName??(keys.length?nm(keys[0]):'');
 const id=name+'\0'+keys.length+'\0'+keys[0]+'\0'+keys[keys.length-1];
 const c=metrCache.get(id);if(c&&c.v===ver)return c.m;
 let sz=0,mod=0,d=0,p=0,n=0,rc=0;
 for(const k of keys){
  const f=lib.files[k];sz+=f?.s||0;mod=Math.max(mod,f?.m||0);rc=Math.max(rc,recent[k]||0);
  const[a,b]=prog[k]||[0,0];if(b){d+=b;p+=Math.min(a,b);if(b-a<2)n++}
 }
 const m={name,sz,mod,rc,pct:d?Math.round(p/d*100):0,left:d-p,n,tot:keys.length,stt:(keys.length&&n===keys.length)?2:keys.some(k=>(prog[k]?.[0]||0)>.5)?1:0};
 metrCache.set(id,{v:ver,m});if(metrCache.size>400)metrCache.clear();
 return m;
}

const fst=k=>{const[a,b]=prog[k]||[0,0];return b&&b-a<2?2:a>.5?1:0};

/* ---------- cover art engine ---------- */
const covMem=new Map(),covRefs=new Map(),covQ=[],covBusy={v:false};
function findCovRef(prefix){let p=prefix;while(p){if(covRefs.has(p))return covRefs.get(p);const b=p.slice(0,-1),i=b.lastIndexOf('/');p=i<0?'':b.slice(0,i+1)}return null}
async function produceCover(prefix){
 let blob=null;const ck=findCovRef(prefix);
 if(ck){const f=await getFile(ck);if(f)blob=f}
 if(!blob){
  for(const k of gather(prefix)){const f=await getFile(k);if(!f)continue;blob=await extractArtBlob(f);if(blob)break;await idle()}
 }
 if(!blob)return null;
 const u=await toThumbURL(blob);
 covMem.set(prefix,u);await cput(prefix,u);
 return u;
}
function covDone(prefix,u){
 const imgs=pendingImgs.get(prefix);if(imgs){for(const im of imgs)if(!im.src)im.src=u;pendingImgs.delete(prefix)}
 const hc=$('#hCv');if(hc&&hc.dataset.cov===prefix&&!hc.src)hc.src=u;
 if(key&&dirOf(key)===prefix&&(cover===art||!cover))setCover(u);
}
async function covPump(){
 if(covBusy.v)return;covBusy.v=true;
 while(covQ.length){
  const prefix=covQ.shift();
  if(covMem.has(prefix))continue;
  await idle();
  const u=await produceCover(prefix).catch(()=>null);
  if(u)covDone(prefix,u);
 }
 covBusy.v=false;
}
function requestCover(prefix){if(covMem.has(prefix))return;covQ.push(prefix);covPump()}
async function hydrateCovers(scope){
 for(const im of scope.querySelectorAll('img[data-cov]')){
  const p=im.dataset.cov;if(im.src)continue;
  let u=covMem.get(p);
  if(u===undefined){u=await cget(p);if(u)covMem.set(p,u)}
  if(u)im.src=u;
  else{let set=pendingImgs.get(p);if(!set)pendingImgs.set(p,set=new Set());set.add(im);requestCover(p)}
 }
}
async function toThumbURL(blob){
 try{
  const bm=await createImageBitmap(blob),S=256,r=Math.min(1,S/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*r));c.height=Math.max(1,Math.round(bm.height*r));
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close?.();
  return c.toDataURL('image/jpeg',.78);
 }catch{return URL.createObjectURL(blob)}
}
/* --- metadata parsers: ID3v2 (MP3) + MP4 atoms (M4B/M4A) • slice-only reads --- */
const TD=new TextDecoder();
async function id3(f){
 const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(h.length<10||String.fromCharCode(h[0],h[1],h[2])!=='ID3')return null;
 const ver=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
 const b=new Uint8Array(await f.slice(10,10+Math.min(sz,24e6)).arrayBuffer()),dv=new DataView(b.buffer,b.byteOffset);
 const out=[],ret={ch:out,img:null};
 const str=(s,e,enc)=>new TextDecoder(enc==1?'utf-16':enc==2?'utf-16be':enc==3?'utf-8':'iso-8859-1').decode(b.subarray(s,e)).replace(/\0/g,'');
 const fs=o=>ver==4?((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127):dv.getUint32(o);
 const frames=(o,end,cb)=>{while(o+10<=end&&o+10<=b.length){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;const s=fs(o+4);if(s<0||o+10+s>end)break;cb(id,o+10,o+10+s);o+=10+s}};
 frames(0,b.length,(id,s,e)=>{
  if(id==='CHAP'){
   let i=s;while(b[i])i++;const st=dv.getUint32(i+1);let title='';
   frames(i+17,e,(sid,ss,se)=>{if(sid==='TIT2')title=str(ss+1,se,b[ss])});
   out.push({t:st/1000,n:title||'Chapter '+(out.length+1)});
  }else if(id==='APIC'&&!ret.img){
   const enc=b[s];let i=s+1;
   const m0=i;while(i<e&&b[i])i++;const mime=TD.decode(b.subarray(m0,i));
   i++;i++;
   if(enc==1||enc==2){while(i+1<e&&!(b[i]===0&&b[i+1]===0))i+=2;i+=2}
   else{while(i<e&&b[i])i++;i++}
   i=Math.min(i,e);
   if(i<e)ret.img=new Blob([b.subarray(i,e)],{type:mime||'image/jpeg'});
  }
 });
 ret.ch.sort((x,y)=>x.t-y.t);
 return ret;
}
const MP4C={moov:1,udta:1,meta:1,ilst:1,covr:1,trak:1,mdia:1,minf:1,stbl:1};
function walkMp4(b,o,e,ret){
 const dv=new DataView(b.buffer,b.byteOffset);
 while(o+8<=e){
  let s=dv.getUint32(o);const ty=String.fromCharCode(b[o+4],b[o+5],b[o+6],b[o+7]);let hd=8;
  if(s===1){if(o+16>e)break;s=Number(dv.getBigUint64(o+8));hd=16}
  if(s===0)s=e-o;if(s<8||o+s>e)break;
  let c=o+hd;
  if(ty==='meta')c+=4;
  if(ty==='chpl'&&!ret.ch){
   c+=4;const n=b[c++],arr=[];
   for(let j=0;j<n&&c+9<=o+s;j++){const st=Number(dv.getBigUint64(c));c+=8;const l=b[c++];arr.push({t:st/1e7,n:TD.decode(b.subarray(c,c+l))});c+=l}
   ret.ch=arr;
  }else if(ty==='data'&&!ret.img){
   const p=c+8;
   if(p<o+s&&((b[p]===0xFF&&b[p+1]===0xD8)||(b[p]===0x89&&b[p+1]===0x50)))
    ret.img=new Blob([b.subarray(p,o+s)],{type:b[p]===0x89?'image/png':'image/jpeg'});
  }else if(MP4C[ty])walkMp4(b,c,o+s,ret);
  o+=s;
 }
}
async function mp4(f){
 const ret={ch:null,img:null};let o=0;const size=f.size;
 while(o+16<=size){
  const h=new DataView(await f.slice(o,o+16).arrayBuffer());
  let s=h.getUint32(0);const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));let hd=8;
  if(s===1){s=Number(h.getBigUint64(8));hd=16}
  if(s===0)s=size-o;if(s<8||o+s>size)break;
  if(ty==='moov'&&s<=64e6){walkMp4(new Uint8Array(await f.slice(o+hd,o+s).arrayBuffer()),0,s-hd,ret);return ret}
  o+=s;
 }
 return ret;
}
async function extractArtBlob(f){try{if(/\.(m4b|m4a|mp4|aac|3gp)$/i.test(f.name))return(await mp4(f)).img;const r=await id3(f);return r?.img||null}catch{return null}}
async function loadCh(f,k){
 chapters=[];lastCi=-2;updateTools();
 const noArtYet=cover===art||!cover;
 try{
  if(/\.(m4b|m4a|mp4|aac)$/i.test(f.name)){const r=await mp4(f);chapters=r.ch||[];if(r.img&&key===k&&noArtYet)injectImg(r.img,k)}
  else{const r=await id3(f);if(r){chapters=r.ch;if(r.img&&key===k&&noArtYet)injectImg(r.img,k)}}
 }catch{}
 if(key===k){updateTools();tick()}
}
async function injectImg(blob,k){
 const u=await toThumbURL(blob),p=dirOf(k);
 if(!covMem.has(p)){covMem.set(p,u);await cput(p,u);covDone(p,u)}
 if(key===k)setCover(u);
}

/* ---------- direct storage access (zero-lag streaming, no memory bloat) ---------- */
async function ingest(id,items,covers,merge){
 if(!lib.roots.find(r=>r.id===id))lib.roots.push({id,name:id});
 if(!merge)for(const k in lib.files)if(lib.files[k].r===id)delete lib.files[k];
 live.add(id);
 const CH=250;
 for(let i=0;i<items.length;i+=CH){
  const end=Math.min(items.length,i+CH);
  for(let j=i;j<end;j++){
   const it=items[j],k=id+'/'+it.rel,o=lib.files[k]||{};
   lib.files[k]={n:it.rel.split('/').pop(),r:id,p:it.rel,s:it.f?it.f.size:o.s,m:it.f?it.f.lastModified:o.m};
   if(it.f)fobjs[k]=it.f;      /* File refs are zero-copy pointers to disk — never buffered in RAM */
   if(it.h)handles[k]=it.h;
  }
  scanShow(t('scanning',Math.round(end/items.length*100)));
  await idle();
 }
 for(const c of covers||[])covRefs.set(id+'/'+c.rel.slice(0,c.rel.lastIndexOf('/')+1),id+'/'+c.rel);
 libVer++;gatherCache.clear();SV('ab_lib',lib);scanShow(null);
 renderAll();if(tab==='set')renderSettings();
 durQueue();
}
async function walk(dir,pre,out,covs){
 for await(const[n,h]of dir.values()){
  if(h.kind==='directory')await walk(h,pre+n+'/',out,covs);
  else if(isAud(n))out.push({rel:pre+n,h});
  else if(isCov(n))covs.push({rel:pre+n,h});
  if(out.length%150===0)await idle();
 }
}
async function scanHandle(id){
 const out=[],covs=[];
 try{await walk(rootH[id],'',out,covs)}catch(e){toast(t('cantRead'));return}
 for(const c of covs)handles[id+'/'+c.rel]=c.h;
 await ingest(id,out,covs);
}

async function ensureRoot(id){if(live.has(id)||!rootH[id])return;try{if(await rootH[id].requestPermission({mode:'read'})==='granted')await scanHandle(id)}catch{}}
async function ensureFile(k){
 if(fobjs[k])return;
 if(!handles[k]){const h=await hget('f:'+k);if(h)handles[k]=h}
 if(handles[k]){try{await handles[k].requestPermission({mode:'read'})}catch{}}
}
async function reconnect(id){await ensureRoot(id);if(!live.has(id)){pending=id;$('#fDir').click()}}
function removeRoot(id){
 if(!confirm(t('confirmRm',rootName(id))))return;
 lib.roots=lib.roots.filter(r=>r.id!==id);for(const k in lib.files)if(lib.files[k].r===id)delete lib.files[k];
 libVer++;gatherCache.clear();SV('ab_lib',lib);cur=[];renderAll();if(tab==='set')renderSettings();
}
async function rescanAll(){let n=0;for(const r of lib.roots){if(!rootH[r.id])continue;try{if(await rootH[r.id].requestPermission({mode:'read'})==='granted'){await scanHandle(r.id);n++}}catch{}}toast(t(n?'scanned':'pickerNo'))}
async function getFile(k){
 if(fobjs[k])return fobjs[k];
 if(handles[k]){try{return fobjs[k]=await handles[k].getFile()}catch{}}
 return null;
}
async function boot(){
 for(const r of lib.roots){
  if(!r.fs)continue;const h=await hget(r.id);if(!h)continue;rootH[r.id]=h;
  try{if(await h.queryPermission({mode:'read'})==='granted')await scanHandle(r.id)}catch{}
  await idle();
 }
 renderAll();
}
let dqRun=false;
async function durQueue(){
 if(dqRun)return;dqRun=true;
 const keys=Object.keys(lib.files);
 if(last&&lib.files[last]){const i=keys.indexOf(last);if(i>0)[keys[0],keys[i]]=[keys[i],keys[0]]}
 let done=0,probed=0;
 for(const k of keys){
  const F=lib.files[k];if(!F)continue;
  const have=prog[k]?.[1];
  if(have&&F.m!==undefined){done++;continue}
  const f=await getFile(k);
  if(f){F.s=f.size;F.m=f.lastModified}
  if(!have&&f){
   probed++;
   const u=URL.createObjectURL(f);
   await new Promise(r=>{const a=new Audio();const fin=()=>{a.src='';r()};a.preload='metadata';
    a.onloadedmetadata=()=>{if(isFinite(a.duration))prog[k]=[prog[k]?.[0]||0,a.duration];fin()};
    a.onerror=fin;setTimeout(fin,4000);a.src=u}).catch(()=>{});
   URL.revokeObjectURL(u);
   if(probed%12===0){SV('ab_lib',lib);SV('ab_prog',prog);scanShow(t('probing',done,keys.length));await raf()}
  }
  done++;
  if(done%40===0)await idle();
 }
 SV('ab_lib',lib);SV('ab_prog',prog);progVer++;scanShow(null);dqRun=false;
 if(tab==='lib')renderLib(true);else if(tab==='pl')renderPlBody();
}

function accCard(id,icon,titleKey,previewFn){

 const h=mk('button',null,'accH');
 const ic=mk('span',icon,'aIc'),tx=mk('div',null,'aTx'),pv=mk('small',previewFn?previewFn():'');

 /* merge — current library/audio stays untouched, payloads merge key-by-key */
 if(data.lib){for(const r of data.lib.roots||[])if(!lib.roots.find(x=>x.id===r.id))lib.roots.push(r);
  for(const k in data.lib.files||{})if(!lib.files[k])lib.files[k]=data.lib.files[k];libVer++}

/* ---------- touch gestures on the player ---------- */
(()=>{
 const vp=$('#v-play'),cvw=$('#coverW');
 let sx=0,sy=0,st=0,active=false,lastTap=0,lastSide='',tapH=0;
 function flash(el){el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('on'),480)}
 vp.addEventListener('touchstart',e=>{
  if(e.target.closest('input,button,#sheet')){active=false;return}
  const t0=e.touches[0];sx=t0.clientX;sy=t0.clientY;st=Date.now();active=true;
 },{passive:true});
 vp.addEventListener('touchend',e=>{
  if(!active)return;active=false;
  const t0=e.changedTouches[0],dx=t0.clientX-sx,dy=t0.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy),dt=Date.now()-st;
  if(ax>64&&ay<48){ // horizontal swipe → skip
   if(dx<0){skip(cfg.fwd);flash($('#tapR'))}else{skip(-cfg.back);flash($('#tapL'))}
   return;
  }
  if(dy>80&&ax<56){show('lib');return} // swipe down → collapse to library (mini player stays alive)
  if(ax<12&&ay<12&&dt<300){ // tap / double-tap
   const r=cvw.getBoundingClientRect(),inCover=t0.clientX>=r.left&&t0.clientX<=r.right&&t0.clientY>=r.top&&t0.clientY<=r.bottom;
   if(!inCover)return;
   const side=t0.clientX<r.left+r.width*.4?'L':t0.clientX>r.right-r.width*.4?'R':'C',now=Date.now();
   if(side!=='C'&&now-lastTap<320&&lastSide===side){clearTimeout(tapH);lastTap=0;side==='L'?(skip(-cfg.back),flash($('#tapL'))):(skip(cfg.fwd),flash($('#tapR')))}
   else{lastTap=now;lastSide=side;clearTimeout(tapH);tapH=setTimeout(()=>{if(side==='C')toggle()},300)}
  }
 },{passive:true});
})();

/* ---------- screen-off reliability ---------- */
function silentSrc(){
 const sr=22050,n=sr,bf=new ArrayBuffer(44+n*2),v=new DataView(bf);
 const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');
 v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);
 v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
 w(36,'data');v.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([bf],{type:'audio/wav'}));
}
let keepEl=null;
function keepAlive(on){

 keepEl.play().catch(()=>{});
}
